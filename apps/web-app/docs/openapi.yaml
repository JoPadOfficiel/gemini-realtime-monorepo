openapi: 3.0.0
info:
  title: Next.js SaaS Stripe Starter API
  version: 1.0.0
  description: >-
    Comprehensive API documentation for the Next.js SaaS Stripe Starter
    application
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000
    description: Development server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
    SessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: Session-based authentication using NextAuth
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
      required:
        - message
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          format: email
          description: User email address
        name:
          type: string
          description: User display name
        image:
          type: string
          format: uri
          description: User profile image URL
      required:
        - id
        - email
security:
  - SessionAuth: []
tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: User Management
    description: User profile and account management
  - name: Webhooks
    description: External service webhooks
  - name: Utilities
    description: Utility endpoints for various features
paths:
  /api/user:
    delete:
      summary: Delete current user account
      description: >-
        Permanently deletes the authenticated user's account and all associated
        data
      tags:
        - User Management
      security:
        - SessionAuth: []
      responses:
        '200':
          description: User account deleted successfully
          content:
            text/plain:
              schema:
                type: string
                example: User deleted successfully!
        '401':
          description: User not authenticated or invalid session
          content:
            text/plain:
              schema:
                type: string
                example: Not authenticated
        '500':
          description: Internal server error during deletion
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
