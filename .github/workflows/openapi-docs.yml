name: OpenAPI Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/api/**'
      - 'lib/validations/**'
      - 'lib/swagger.ts'
      - 'scripts/generate-openapi.js'
      - 'scripts/validate-openapi.js'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/api/**'
      - 'lib/validations/**'
      - 'lib/swagger.ts'
      - 'scripts/generate-openapi.js'
      - 'scripts/validate-openapi.js'

jobs:
  generate-and-validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate OpenAPI specification
        run: pnpm run docs:generate
        
      - name: Validate OpenAPI specification
        run: pnpm run docs:validate --markdown
        
      - name: Upload OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openapi-docs
          path: |
            docs/openapi.json
            docs/openapi.yaml
            docs/API.md
          retention-days: 30
          
      - name: Comment PR with documentation link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the generated markdown documentation
            const markdownPath = path.join(process.cwd(), 'docs', 'API.md');
            let markdownContent = '';
            
            if (fs.existsSync(markdownPath)) {
              markdownContent = fs.readFileSync(markdownPath, 'utf8');
              // Truncate if too long for GitHub comment
              if (markdownContent.length > 60000) {
                markdownContent = markdownContent.substring(0, 60000) + '\n\n... (truncated)';
              }
            }
            
            const comment = `## 📚 API Documentation Updated
            
            The OpenAPI specification has been generated and validated successfully!
            
            ### 📊 Summary
            - ✅ OpenAPI specification is valid
            - 📄 Documentation artifacts generated
            - 🔍 No validation errors found
            
            ### 📋 Generated Files
            - \`docs/openapi.json\` - OpenAPI 3.0 specification
            - \`docs/openapi.yaml\` - YAML format specification  
            - \`docs/API.md\` - Markdown documentation
            
            ### 🔗 Quick Links
            - [View OpenAPI Spec](../blob/${context.sha}/docs/openapi.json)
            - [View YAML Spec](../blob/${context.sha}/docs/openapi.yaml)
            - [View Markdown Docs](../blob/${context.sha}/docs/API.md)
            
            <details>
            <summary>📖 API Documentation Preview</summary>
            
            \`\`\`markdown
            ${markdownContent}
            \`\`\`
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
  deploy-docs:
    runs-on: ubuntu-latest
    needs: generate-and-validate-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate OpenAPI specification
        run: pnpm run docs:generate
        
      - name: Generate markdown documentation
        run: pnpm run docs:validate --markdown
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: api-docs
          
      - name: Create Release with Documentation
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            docs/openapi.json
            docs/openapi.yaml
            docs/API.md
          body: |
            ## 📚 API Documentation
            
            This release includes the latest API documentation:
            
            - **OpenAPI Specification**: `openapi.json`
            - **YAML Specification**: `openapi.yaml` 
            - **Markdown Documentation**: `API.md`
            
            ### 🔗 Online Documentation
            - [Interactive API Docs](https://your-domain.com/docs)
            - [GitHub Pages Docs](https://your-username.github.io/your-repo/api-docs/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
