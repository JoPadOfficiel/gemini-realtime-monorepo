[build]
  # Build command for Next.js app in monorepo
  command = "cat > pnpm-workspace.yaml << 'EOF'\npackages:\n  - \"apps/*\"\n  - \"packages/*\"\nEOF\nrm -f apps/web-app/pnpm-lock.yaml && pnpm install --no-frozen-lockfile --shamefully-hoist && pnpm --filter saas-starter run build"

  # Base directory for the build
  base = "."

  # Publish directory for Next.js
  publish = "apps/web-app"

[build.environment]
  # Node.js version
  NODE_VERSION = "20"

  # PNPM version
  PNPM_VERSION = "9"

  # PNPM flags for monorepo compatibility
  PNPM_FLAGS = "--shamefully-hoist"

  # Disable automatic dependency installation
  NETLIFY_SKIP_INSTALL = "true"

  # Disable Next.js telemetry
  NEXT_TELEMETRY_DISABLED = "1"

  # Build optimizations
  NODE_OPTIONS = "--max-old-space-size=4096"

# Plugin configuration for Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect rules for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# API routes handling
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Gemini Live routes
[[redirects]]
  from = "/dashboard/gemini-live/*"
  to = "/dashboard/gemini-live/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/dashboard/gemini-live/*"
  [headers.values]
    # Allow camera and microphone for Gemini Live features
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# Cache optimization
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
